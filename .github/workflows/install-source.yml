name: Install uploaded Day Trader Desk source

on:
  push:
    paths:
      - '.github/workflows/install-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundle and install application
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .deploy/part1.txt ]; then
            echo "No staged bundle remains; files already installed."
            exit 0
          fi
          cat .deploy/part1.txt .deploy/part2.txt .deploy/part3.txt .deploy/part4.txt | base64 --decode > /tmp/daytraderskill.tar.xz
          xz --test /tmp/daytraderskill.tar.xz
          tar -tJf /tmp/daytraderskill.tar.xz
          tar -xJf /tmp/daytraderskill.tar.xz
          rm -rf .deploy
          python -m py_compile app.py core.py test_core.py
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Install complete Day Trader Desk app from verified archive"
          git push origin HEAD:main
